<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>League History – Whippany Fantasy Football League</title>
<meta name="description" content="Season-by-season champions and history for the Whippany Fantasy Football League (WFFL)." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title"><span class="ball">🏈</span><span id="league-name">Whippany Fantasy Football League</span></h1>
    <p class="site-subtitle">Current standings, league history, and all-time records</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="draftcentral.html">Draft Central</a>
      <a href="stats.html">Stats</a>
      <a href="records.html">Records</a>
      <a href="headtohead.html">Head-to-Head</a>
      <a href="history.html">History</a>
      <a href="constitution.html">Constitution</a>
    </nav>
  </div>
</header>

<main>
  <div id="content">
    <div class="empty-state">Loading history…</div>
  </div>
</main>

<footer class="site-footer">
  <p id="last-updated"></p>
</footer>

<script src="js/data.js"></script>
<script>
  let pageData = null;

  async function render() {
    const content = document.getElementById("content");
    try {
      const data = await loadLeagueData();
      pageData = data;
      document.getElementById("league-name").textContent = data.leagueName;
      applyLogo(data);
      setLastUpdated(data);

      content.innerHTML = "";
      const banner = sampleBanner(data);
      if (banner) content.appendChild(banner);

      if (!data.seasons || data.seasons.length === 0) {
        content.appendChild(
          emptyState([
            "No history yet. Once the scheduled GitHub Action runs (or you run ",
            el("code", {}, "node scripts/fetch-sleeper-data.mjs"),
            " yourself), season-by-season champions will show up here.",
          ])
        );
        return;
      }

      const podiumFinishers = (data.allTime?.standings || [])
        .filter((s) => s.championships > 0 || s.runnerUps > 0 || s.thirdPlaces > 0)
        .sort((a, b) => b.championships - a.championships || b.runnerUps - a.runnerUps || b.thirdPlaces - a.thirdPlaces);

      if (podiumFinishers.length > 0) {
        content.appendChild(
          el("div", { class: "card" }, [
            el("h2", {}, "🏆 Hall of Fame"),
            el("div", { class: "table-scroll" }, buildHallOfFameTable(podiumFinishers)),
          ])
        );
      }

      content.appendChild(
        el("div", { class: "card" }, [
          el("h2", {}, "Champions by Season"),
          el("div", { class: "table-scroll" }, buildSeasonTable(data.seasons)),
        ])
      );

      content.appendChild(buildSeasonViewerCard(data.seasons));
    } catch (err) {
      content.innerHTML = "";
      content.appendChild(emptyState(`Couldn't load league data: ${err.message}`));
    }
  }

  function buildHallOfFameTable(rows) {
    const table = el("table");
    table.appendChild(
      el("thead", {}, [
        el("tr", {}, [
          el("th", {}, "Manager"),
          el("th", {}, "🏆 Championships"),
          el("th", {}, "🥈 Runner-Up"),
          el("th", {}, "🥉 3rd Place"),
        ]),
      ])
    );
    const tbody = el("tbody");
    rows.forEach((r) => {
      tbody.appendChild(
        el("tr", {}, [
          el("td", {}, managerLink(r.ownerId, r.managerName)),
          el(
            "td",
            { class: r.championships > 0 ? "rank-1" : "" },
            r.championships > 0 ? `${"🏆".repeat(r.championships)} (${r.championshipYears.join(", ")})` : "—"
          ),
          el("td", {}, r.runnerUps > 0 ? `${r.runnerUps} (${r.runnerUpYears.join(", ")})` : "—"),
          el("td", {}, r.thirdPlaces > 0 ? `${r.thirdPlaces} (${r.thirdPlaceYears.join(", ")})` : "—"),
        ])
      );
    });
    table.appendChild(tbody);
    return table;
  }

  function buildSeasonTable(seasons) {
    const table = el("table");
    table.appendChild(
      el("thead", {}, [el("tr", {}, [el("th", {}, "Year"), el("th", {}, "Champion"), el("th", {}, "Runner-Up")])])
    );
    const tbody = el("tbody");
    seasons
      .filter((s) => s.champion || s.runnerUp)
      .forEach((s) => {
        tbody.appendChild(
          el("tr", {}, [
            el("td", {}, String(s.year)),
            el(
              "td",
              { class: s.champion ? "rank-1" : "" },
              s.champion ? el("span", {}, ["🏆 ", managerLink(s.champion.ownerId, s.champion.teamName)]) : "TBD"
            ),
            el("td", {}, s.runnerUp ? managerLink(s.runnerUp.ownerId, s.runnerUp.teamName) : "—"),
          ])
        );
      });
    table.appendChild(tbody);
    return table;
  }

  function buildSeasonViewerCard(seasons) {
    const eligible = seasons.filter((s) => s.standings && s.standings.length > 0);
    const select = el(
      "select",
      { id: "season-picker" },
      eligible.map((s) => el("option", { value: String(s.year) }, String(s.year)))
    );
    const resultsDiv = el("div", { id: "season-picker-results" });

    select.addEventListener("change", () => renderSeasonStandings(eligible, select.value, resultsDiv));

    // Default to the most recent *completed* season (has a champion) rather
    // than a not-yet-played placeholder, which would just show all zeros.
    const defaultSeason = eligible.find((s) => s.champion) || eligible[0];
    if (defaultSeason) {
      select.value = String(defaultSeason.year);
      renderSeasonStandings(eligible, defaultSeason.year, resultsDiv);
    }

    return el("div", { class: "card" }, [
      el("h2", {}, "Final Standings by Season"),
      el("div", { class: "manager-picker" }, [el("label", { for: "season-picker" }, "Season:"), select]),
      resultsDiv,
    ]);
  }

  function renderSeasonStandings(eligible, year, resultsDiv) {
    const season = eligible.find((s) => String(s.year) === String(year));
    resultsDiv.innerHTML = "";
    if (!season) return;

    const table = el("table");
    table.appendChild(
      el("thead", {}, [
        el("tr", {}, [
          el("th", {}, "#"),
          el("th", {}, "Manager"),
          el("th", {}, "W"),
          el("th", {}, "L"),
          el("th", {}, "T"),
          el("th", {}, "PF"),
          el("th", {}, "PA"),
        ]),
      ])
    );
    const tbody = el("tbody");
    [...season.standings]
      .sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999))
      .forEach((row) => {
        tbody.appendChild(
          el("tr", {}, [
            el("td", { class: row.rank === 1 ? "rank-1" : "" }, row.rank === 1 ? `🏆 ${row.rank}` : String(row.rank ?? "—")),
            el("td", {}, managerLink(row.ownerId, row.managerName)),
            el("td", {}, String(row.wins)),
            el("td", {}, String(row.losses)),
            el("td", {}, String(row.ties)),
            el("td", {}, row.pointsFor.toFixed(2)),
            el("td", {}, row.pointsAgainst.toFixed(2)),
          ])
        );
      });
    table.appendChild(tbody);
    resultsDiv.appendChild(el("div", { class: "table-scroll" }, table));
  }

  render();
</script>
</body>
</html>
