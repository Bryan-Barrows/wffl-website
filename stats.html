<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stats – Whippany Fantasy Football League</title>
<meta name="description" content="Look up any manager's career stats, back to 2012, for the Whippany Fantasy Football League (WFFL)." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title"><span class="ball">🏈</span><span id="league-name">Whippany Fantasy Football League</span></h1>
    <p class="site-subtitle">Current standings, league history, and all-time records</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="draftcentral.html">Draft Central</a>
      <a href="stats.html">Stats</a>
      <a href="records.html">Records</a>
      <a href="headtohead.html">Head-to-Head</a>
      <a href="history.html">History</a>
      <a href="constitution.html">Constitution</a>
    </nav>
  </div>
</header>

<main>
  <div id="content">
    <div class="empty-state">Loading stats…</div>
  </div>
</main>

<footer class="site-footer">
  <p id="last-updated"></p>
</footer>

<script src="js/data.js"></script>
<script>
  const SORT_COLUMNS = [
    { key: "manager", label: "Manager", numeric: false },
    { key: "seasons", label: "Seasons", numeric: true },
    { key: "wins", label: "W", numeric: true },
    { key: "losses", label: "L", numeric: true },
    { key: "ties", label: "T", numeric: true },
    { key: "winpct", label: "Win %", numeric: true },
    { key: "pf", label: "Avg PF", numeric: true },
    { key: "pa", label: "Avg PA", numeric: true },
    { key: "champs", label: "🏆", numeric: true },
  ];

  // Defaults to the same ordering the table opens with (best win% first).
  const sortState = { key: "winpct", dir: "desc" };

  async function render() {
    const content = document.getElementById("content");
    try {
      const data = await loadLeagueData();
      document.getElementById("league-name").textContent = data.leagueName;
      applyLogo(data);
      setLastUpdated(data);

      content.innerHTML = "";
      const banner = sampleBanner(data);
      if (banner) content.appendChild(banner);

      const standings = data.allTime?.standings || [];
      if (standings.length === 0) {
        content.appendChild(
          emptyState([
            "No stats yet. Once league data is imported, every manager's career stats back through the years ",
            "will show up here.",
          ])
        );
        return;
      }

      const select = el(
        "select",
        { id: "manager-picker" },
        standings
          .slice()
          .sort((a, b) => a.managerName.localeCompare(b.managerName))
          .map((row) => el("option", { value: row.ownerId }, `${row.managerName} (${row.teamName})`))
      );
      select.addEventListener("change", () => {
        if (select.value) window.location.href = `manager.html?id=${encodeURIComponent(select.value)}`;
      });

      content.appendChild(
        el("div", { class: "card" }, [
          el("h2", {}, "Look Up a Manager"),
          el("div", { class: "manager-picker" }, [el("label", { for: "manager-picker" }, "Manager:"), select]),
        ])
      );

      const tableContainer = el("div", { class: "table-scroll" });
      renderAllTimeTable(tableContainer, standings);

      content.appendChild(
        el("div", { class: "card" }, [el("h2", {}, "All-Time Standings"), tableContainer])
      );
    } catch (err) {
      content.innerHTML = "";
      content.appendChild(emptyState(`Couldn't load league data: ${err.message}`));
    }
  }

  function statsFor(row) {
    const games = Math.max(1, row.wins + row.losses + row.ties);
    return {
      manager: row.managerName.toLowerCase(),
      seasons: row.seasonsPlayed,
      wins: row.wins,
      losses: row.losses,
      ties: row.ties,
      winpct: (row.wins + row.ties * 0.5) / games,
      pf: row.pointsFor / games,
      pa: row.pointsAgainst / games,
      champs: row.championships,
    };
  }

  function renderAllTimeTable(container, standings) {
    const computed = standings.map((row) => ({ row, s: statsFor(row) }));
    computed.sort((a, b) => {
      const av = a.s[sortState.key];
      const bv = b.s[sortState.key];
      const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
      return sortState.dir === "asc" ? cmp : -cmp;
    });

    const table = el("table");
    const headerCells = [el("th", {}, "#")];
    SORT_COLUMNS.forEach((col) => {
      const isActive = sortState.key === col.key;
      const arrow = isActive ? (sortState.dir === "asc" ? " ▲" : " ▼") : "";
      const th = el("th", { class: "sortable-th" }, col.label + arrow);
      th.addEventListener("click", () => {
        if (sortState.key === col.key) {
          sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
        } else {
          sortState.key = col.key;
          sortState.dir = col.numeric ? "desc" : "asc";
        }
        renderAllTimeTable(container, standings);
      });
      headerCells.push(th);
    });
    table.appendChild(el("thead", {}, [el("tr", {}, headerCells)]));

    const tbody = el("tbody");
    computed.forEach(({ row }, i) => {
      const games = Math.max(1, row.wins + row.losses + row.ties);
      tbody.appendChild(
        el("tr", {}, [
          el("td", { class: i === 0 ? "rank-1" : "" }, String(i + 1)),
          el("td", {}, managerLink(row.ownerId, row.managerName)),
          el("td", {}, String(row.seasonsPlayed)),
          el("td", {}, String(row.wins)),
          el("td", {}, String(row.losses)),
          el("td", {}, String(row.ties)),
          el("td", {}, winPct(row.wins, row.losses, row.ties)),
          el("td", {}, (row.pointsFor / games).toFixed(1)),
          el("td", {}, (row.pointsAgainst / games).toFixed(1)),
          el("td", {}, row.championships > 0 ? `${row.championships}` : "—"),
        ])
      );
    });
    table.appendChild(tbody);

    container.innerHTML = "";
    container.appendChild(table);
  }

  render();
</script>
</body>
</html>
